<div class="navbar-container">
  <app-navbar></app-navbar>
</div>

<div class="page-wrapper">
  <h1 class="app-title">Wybierz sposób tworzenia CV</h1>

  <div class="main-card">
    <p class="welcome-text">
      Możesz skorzystać z pomocy sztucznej inteligencji lub stworzyć CV samodzielnie.
    </p>

    <div class="action-buttons">
      <button class="primary-btn p-button p-component" (click)="chooseAI()">
         Stwórz CV z pomocą AI
      </button>

      <button class="secondary-btn p-button p-component" (click)="chooseClassic()">
         Stwórz CV samodzielnie
      </button>

      <button class="back-btn p-button p-component" (click)="goBack()">
        ← Wróć
      </button>
    </div>
  </div>
</div>
